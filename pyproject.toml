[project]
name = "cloudtrailblazer"
version = "0.1.0"
description = "Local CloudTrail investigation workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "duckdb>=1.4,<2",
    "ijson>=3.4,<4",
    "simplejson>=3.20,<4",
    "pytz>=2025.2", # DuckDB's TIMESTAMPTZ-to-Python conversion requires this.
]

[project.scripts]
cloudtrailblazer = "cloudtrailblazer.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cloudtrailblazer"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
